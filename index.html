<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <meta name="referrer" content="no-referrer">
  <title>Mégathèque</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="back" class="icon-btn" aria-label="Retour" hidden>
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
    </button>
    <div class="titles">
      <h1 id="title">Mégathèque</h1>
      <div id="crumbs" class="crumbs"></div>
    </div>
    <button id="refresh" class="icon-btn" aria-label="Actualiser" hidden>
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" /></svg>
    </button>
  </header>

  <main id="view"></main>

  <div id="player" class="player" hidden>
    <div class="player-bar">
      <button id="player-close" class="icon-btn" aria-label="Fermer">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
      <div id="player-title" class="player-title"></div>
    </div>
    <video id="video" controls playsinline preload="metadata"></video>
    <div id="player-msg" class="player-msg" hidden></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
